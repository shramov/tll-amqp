name: CI

on: [push, pull_request]

jobs:
  build:
    strategy:
      matrix:
        os:
          - ubuntu-24.04
          - ubuntu-26.04
        compiler: [gcc]
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 1
        submodules: true
    - name: RabbitMQ
      uses: namoshek/rabbitmq-github-action@v1
      with:
        ports: '5672:5672'
    - name: update
      run: |
        echo deb https://psha.org.ru/debian/ `echo ${{ matrix.os }} | tr -d -` contrib backports | sudo tee /etc/apt/sources.list.d/psha.org.ru.list
        sudo wget -O/etc/apt/trusted.gpg.d/psha.org.ru.gpg https://psha.org.ru/debian/pubkey.gpg
        sudo apt update
    - name: install deps
      run: sudo apt install ccache meson pkgconf libfmt-dev libamqpcpp-dev libtll-dev python3-pytest python3-decorator python3-tll python3-aiormq
    - name: configure
      run: meson setup build
    - name: build
      run: ninja -vC build -j2
    - name: test
      run: |
        python3 -m pytest --log-level=DEBUG --log-format='%(relativeCreated) 10.3f %(levelname)-7s %(name)s: %(message)s' -v tests

